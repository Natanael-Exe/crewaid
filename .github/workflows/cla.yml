name: CLA

# Asks every outside contributor to accept CLA.md once, by commenting a fixed
# sentence on their pull request. The CLA lets the maintainer ship
# contributions in builds that are not licensed under the AGPL (the hosted
# cloud edition), which the AGPL alone would not allow.
#
# Signatures are committed to signatures/cla.json on the `cla-signatures`
# branch, never `main`, so the bot needs no bypass of main's branch protection.
#
# pull_request_target runs with a write token in the base repository's
# context. That is safe here only because no step checks out or runs the pull
# request's code; keep it that way.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# Two signatures landing at once would race on the same JSON file.
concurrency:
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the Crewaid CLA and I hereby sign it.'))
    steps:
      # Pinned to the v2.6.1 commit: this step holds a write token, so a moved
      # tag must not be able to change what runs.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Natanael-Exe/crewaid/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: Natanael-Exe,dependabot[bot],github-actions[bot],renovate[bot]
          custom-pr-sign-comment: I have read the Crewaid CLA and I hereby sign it.
          custom-notsigned-prcomment: >-
            Thanks for your contribution! Before we can merge it, please read the
            [Crewaid Contributor License Agreement](https://github.com/Natanael-Exe/crewaid/blob/main/CLA.md)
            and sign it by posting the comment below. You only need to sign once.
          custom-allsigned-prcomment: All contributors have signed the Crewaid CLA. Thank you!
          signed-commit-message: 'chore(cla): $contributorName signed the CLA in $owner/$repo#$pullRequestNo'
          create-file-commit-message: 'chore(cla): create CLA signatures file'
