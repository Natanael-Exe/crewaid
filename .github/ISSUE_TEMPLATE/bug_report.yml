name: Bug report
description: Report a reproducible bug in Crewaid
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: >
        Thanks for reporting a bug! For security vulnerabilities, please follow
        `SECURITY.md` instead of opening a public issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: Edition / setup
      options:
        - Self-hosted (Docker / selfhost-cli)
        - Local source checkout (infra/compose)
        - Cloud
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Crewaid version/commit, Docker version (if applicable).
      placeholder: macOS 15 arm64, v0.1.3, Docker 28.x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any error output (redact tokens, keys, and personal info first).
      render: shell
