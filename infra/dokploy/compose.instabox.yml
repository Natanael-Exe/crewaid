# Dokploy Compose mode (not Stack), for a deployment whose computers run as
# Instabox (instabox.sh) sandboxes. Add the HTTPS domain to the orchestrator
# service on container port 3000 in Dokploy's Domains tab.
#
# Unlike compose.yml, nothing here reaches the host's Docker: no socket mount,
# no crewaid-control network, and no host egress unit. Each computer runs inside
# its own Instabox Firecracker VM with an in-VM INPUT + D-155 egress firewall
# and reaches the orchestrator over one multiplexed SSH tunnel per running VM.
services:
  orchestrator:
    build:
      context: ../..
      dockerfile: infra/dokploy/Dockerfile
      args:
        CREWAID_VERSION: ${CREWAID_RELEASE_TAG:?Set the release being deployed}
    image: crewaid/orchestrator:${CREWAID_RELEASE_TAG:?Set the release being deployed}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the Neon pooled connection URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the Neon direct connection URL}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the public HTTPS origin}
      # Fixed rather than read from .env: a stray `selfhosted` would open
      # password sign-up on a public server.
      CREWAID_EDITION: cloud
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a signing secret}
      CREWAID_CREDENTIAL_KEYRING: ${CREWAID_CREDENTIAL_KEYRING:?Set the provider keyring}
      # Fixed rather than read from .env: this file has no local Docker socket.
      SANDBOX_PROVIDER: instabox
      INSTABOX_API_KEY: ${INSTABOX_API_KEY:?Set an Instabox API key with machines:read, machines:write and machines:delete}
      SANDBOX_INSTABOX_IMAGE: ${SANDBOX_INSTABOX_IMAGE:-ghcr.io/natanael-exe/crewaid-sandbox:latest}
      SANDBOX_INSTABOX_TEMPLATE: ${SANDBOX_INSTABOX_TEMPLATE:-agent-browser}
      NODE_ENV: production
      PORT: '3000'
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD — openssl rand -hex 24}@redis:6379
      ARTIFACT_R2_ACCOUNT_ID: ${ARTIFACT_R2_ACCOUNT_ID:?Set the Cloudflare account id that owns the artifact bucket}
      ARTIFACT_R2_ACCESS_KEY_ID: ${ARTIFACT_R2_ACCESS_KEY_ID:?Set an R2 API token's access key id}
      ARTIFACT_R2_SECRET_ACCESS_KEY: ${ARTIFACT_R2_SECRET_ACCESS_KEY:?Set an R2 API token's secret access key}
      ARTIFACT_R2_BUCKET: ${ARTIFACT_R2_BUCKET:?Set the artifact bucket name}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r)=>r.json().then((h)=>process.exit(r.ok&&h.version&&h.version!=='dev'&&h.version===process.env.CREWAID_VERSION&&h.edition==='cloud'?0:1))).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 20s
      start_period: 90s
      retries: 3
    expose:
      - '3000'
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD — openssl rand -hex 24}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
