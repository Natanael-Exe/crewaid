# Drop-in for infra/compose/crewaid-agent-egress.service on a Dokploy host.
#
# 1. The orchestrator reaches sandbox ports through `crewaid-control`, a bridge
#    only it joins. Its gateway is SANDBOX_PUBLISH_ON, and its interface is the
#    only one the firewall lets open a connection into agent-net, so other
#    containers on this host and neighbours on the provider's network cannot.
# 2. The marker tells the orchestrator container the policy is installed for
#    THIS boot. /run is emptied on reboot, and Docker restarts the container
#    before this unit runs, so without it a routine could wake a computer with
#    no egress policy.
[Service]
ExecStartPre=/bin/rm -f /run/crewaid/egress-ready
ExecStartPre=/bin/sh -ec '/usr/bin/docker network inspect crewaid-control >/dev/null 2>&1 || /usr/bin/docker network create --driver bridge -o com.docker.network.bridge.name=crewaid-ctl0 crewaid-control'
ExecStart=
ExecStart=/usr/bin/python3 /opt/crewaid/infra/compose/agent-egress.py --control-interface crewaid-ctl0
ExecReload=
ExecReload=/usr/bin/python3 /opt/crewaid/infra/compose/agent-egress.py --control-interface crewaid-ctl0
ExecStartPost=/bin/sh -ec 'mkdir -p /run/crewaid && touch /run/crewaid/egress-ready'
