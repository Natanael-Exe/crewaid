# Crewaid Self-Hosted (D-152), on top of the shared base.
#
# Its own app id, name and sign-in scheme, so it installs beside the hosted app
# with its own settings and credentials, and a sign-in callback for one never
# opens the other.
extends: ./electron-builder.yml

appId: ai.crewaid.selfhosted
productName: Crewaid Self-Hosted
artifactName: Crewaid-SelfHosted-${version}-${os}-${arch}.${ext}

extraMetadata:
  # electron-updater names its download cache after this (`<name>-updater`), so
  # each edition gets its own: with the shared `@crewaid/desktop`, one app could
  # clear or pick up the other's pending update.
  name: crewaid-selfhosted
  # Electron names the settings folder — and so the CC-07 credential bag —
  # after the packaged package.json's productName, not the one above. Without
  # this both apps would read and write the same credentials.
  productName: Crewaid Self-Hosted
  crewaid:
    edition: selfhosted

protocols:
  - name: Crewaid Self-Hosted sign-in
    schemes: [crewaid-selfhosted]

# The update feed (D-153). The release workflow uploads the installers and the
# latest*.yml files electron-builder writes beside them; the app reads its feed
# from the app-update.yml this produces. Nothing is published from here.
publish:
  provider: generic
  url: https://downloads.crewaid.io/desktop/selfhosted
  # R2 answers a multi-range request with the whole file, and electron-updater's
  # differential download asks for many ranges at once by default — so every
  # update would fall back to the full installer. One range per request works.
  useMultipleRangeRequest: false
