# Packaging for the Crewaid desktop client.
#
# buildResources is `resources`, NOT electron-builder's default `build`: the
# repo's .gitignore ignores `build/` everywhere as build OUTPUT, so icons left
# at the default path are never committed and every other machine — and CI —
# packages a default Electron icon without noticing. The icons there are
# generated by tools/generate-icons.py from packages/brand/masters.
appId: ai.crewaid.desktop
productName: Crewaid
copyright: Copyright © 2026 Crewaid

directories:
  buildResources: resources
  output: release

# `main` is dist/main.js and the renderer is a vite bundle, so the app is these
# two directories plus whatever production dependencies the MAIN process still
# imports at runtime — @crewaid/shared, better-auth and @better-auth/electron.
# electron-builder collects those from package.json; it must not be given a
# files list so narrow that it drops them, which fails only at launch.
files:
  - dist/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/tsconfig*.json'
  # pdf.js's Node-only canvas. The renderer bundles pdf.js's browser build and
  # draws on the page's own canvas — its Node branch needs `process`, which the
  # sandboxed renderer does not have — and the main process never loads pdf.js.
  # Shipped, it is a per-chip native binary that nothing loads (D-153).
  - '!**/node_modules/@napi-rs/**'

asar: true

# Electron's fuses, flipped in the binary before it is signed. Each default
# turns the shipped app into a general-purpose Node or a debuggable process
# for anyone who can set an environment variable or a flag on it: run as
# Node (ELECTRON_RUN_AS_NODE), preload code (NODE_OPTIONS), attach an
# inspector (--inspect), or load an app from outside the signed asar. Tests
# and `pnpm dev` run the stock Electron binary, which keeps all four.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  # scripts/package.mjs uses a Developer ID when CSC_LINK is supplied, and an
  # explicit ad-hoc signature otherwise. Both bind the final bundle's identity
  # and microphone declaration. Ad-hoc builds still require right-click → Open
  # and cannot install updates by themselves (D-153).
  darkModeSupport: true
  # D-221: the microphone. The usage string is what macOS shows when voice
  # first asks; the entitlement is what lets a hardened, signed build ask.
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Crewaid uses the microphone when you dictate or record a voice message for a bot.
  target:
    # Separate builds for Apple silicon (arm64) and Intel (x64), matching the
    # download options on the site, plus zip archives for in-app updates.
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

dmg:
  # The two-icon window everyone recognises: the app on the left, Applications
  # on the right, so the install gesture is a drag and needs no instructions.
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  # oneClick installers give the user no say in where the app lands and start it
  # the moment they finish; for a self-hosted tool that someone is evaluating,
  # the ordinary wizard is the less surprising of the two.
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  category: Development
  icon: resources/icon.png
  # A .deb refuses to build without a maintainer and a project URL (the latter
  # is package.json's `homepage`). The maintainer would otherwise come from
  # package.json's `author.email`, which a private workspace package has none of.
  maintainer: Crewaid <support@crewaid.io>
  target:
    - target: deb
      arch: [x64]
