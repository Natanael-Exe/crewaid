# Render Blueprint for self-hosted Crewaid Orchestrator + Postgres + Redis.
# Managed PaaS hosts do not expose a Docker socket, so bot computers default to
# Instabox (https://instabox.sh) via SANDBOX_PROVIDER=instabox. Instabox's Free
# plan includes 1 sandbox (4 vCPU / 8 GiB / 20 GiB) and pulls the public
# crewaid-sandbox image automatically (30-min idle pause, up to 8 h continuous
# run with cooldown). To use Runtime instead, switch SANDBOX_PROVIDER to
# `runtime` and set RUNTIME_API_KEY + SANDBOX_RUNTIME_IMAGE.

databases:
  - name: crewaid-db
    plan: free
    databaseName: crewaid
    user: crewaid

services:
  - type: keyvalue
    name: crewaid-redis
    plan: free
    ipAllowList: []

  - type: web
    name: crewaid-orchestrator
    runtime: docker
    dockerfilePath: ./infra/dokploy/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: CREWAID_EDITION
        value: selfhosted
      - key: SANDBOX_PROVIDER
        value: instabox
      - key: SANDBOX_INSTABOX_IMAGE
        value: ghcr.io/natanael-exe/crewaid-sandbox:latest
      - key: SANDBOX_MAX_RUNNING
        value: '1'
      - key: ARTIFACT_DIR
        value: /tmp/crewaid-artifacts
      - key: DATABASE_URL
        fromDatabase:
          name: crewaid-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: crewaid-redis
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: CREWAID_CREDENTIAL_KEYRING
        sync: false
      - key: CREDENTIAL_KEY
        sync: false
      - key: INSTABOX_API_KEY
        sync: false
