packages:
  - 'apps/*'
  - 'packages/*'

# Build scripts are allowlisted explicitly rather than blanket-approved.
# Prisma needs its engines; esbuild needs its platform binary; the rest are
# transitive natives — cpu-features/ssh2/protobufjs come in through dockerode's
# grpc/ssh2 dependencies, and msgpackr-extract through BullMQ's msgpackr.
onlyBuiltDependencies:
  - '@prisma/engines'
  - cpu-features
  - esbuild
  - msgpackr-extract
  - prisma
  - protobufjs
  - ssh2

# Keep transitive security updates within the upstream major version.
overrides:
  'zod@>=4.0.0 <4.6.6': 4.6.6
  'proxy-addr@>=1.1.0 <2.0.8': 2.0.8
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'multer@>=2.0.0 <2.5.0': 2.5.0
  '@grpc/grpc-js@>=1.14.0 <1.14.5': 1.14.5
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'fast-uri@>=3.0.0 <3.1.7': 3.1.8
  'mysql2@<3.23.1': 3.24.5

# Fix vendored pako's inflateReset/updatewindow bug in noVNC 1.7.0: inflateReset
# zeroes state.wsize without clearing state.window, so updatewindow never
# restores wsize and Tight zlib streams fail with "invalid distance too far back"
# after any Tight reset (60s grant renewal, late viewer join, or upstream recovery).
patchedDependencies:
  '@novnc/novnc@1.7.0': patches/@novnc__novnc@1.7.0.patch
